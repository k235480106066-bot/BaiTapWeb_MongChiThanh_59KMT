server {
    listen 80;
    server_name thanh59kmt.click www.thanh59kmt.click;

    location / {
        root /usr/share/nginx/html/site1;
        index index.html;
    }

    location /api/ {
        proxy_pass http://nodered:1880/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}